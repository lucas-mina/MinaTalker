# 默认配置文件
app:
  listenport: 8010
  max_session: 1

  # SSL/HTTPS 配置（可选，启用后支持远程录音功能）
  ssl: true
  ssl_cert: ssl_certs/certificate.crt
  ssl_key: ssl_certs/private.key

# WebRTC TURN 配置（可选，用于 NAT 穿透；前端设置面板也可配置）
webrtc:
  turn_config:
    urls: ["turn:101.78.221.190:3478", "turns:101.78.221.190:3478"]
    username: "username"
    credential: "password"

model:
  type: musetalk  # wav2lip | musetalk | ultralight | ernerf
  avatar_id: avator_1
  batch_size: 16
  model_path: ./models
  # 是否在启动时预加载 avatar_config.yaml 中声明的 avatar_id 及其 *_ex 到内存
  # true: 启动更慢、占用更多内存，但首次切换/送礼无磁盘加载延迟
  # false: 按需加载，每个 avatar 第一次使用时才从磁盘读取
  preload_avatars: false
  
  # ERNeRF 配置信息参考
  # type: ernerf
  # ernerf:
  #   pose: data/data_kf.json
  #   au: data/au.csv
  #   torso_imgs: ""
  #   workspace: data/video
  #   ckpt: data/pretrained/ngp_kf.pth
  #   # 更多配置请参考 config_nerf.yaml

  # TalkingGaussian 配置信息参考
  # type: talkinggaussian
  # talkinggaussian:
  #   source_path: data/Obama_test
  #   model_path: data/output/Obama
  #   bg_img: "white" # 背景配置: white(白色) | black(黑色) | /path/to/bg.jpg(完整路径)
  # 更多配置请参考 config_talkinggaussian.yaml

# TTS 配置信息，可以改对应的模型，建议edgetts
tts:
  type: edgetts  # edgetts | azuretts | fishtts | gpt-sovits | cosyvoice | tencent | doubao | indextts2 | xtts | elevenlabs
  ref_file: zh-CN-YunxiaNeural

  # ElevenLabs 示例配置：
  # type: elevenlabs
  # ref_file: JBFqnCBsd6RMkjVDRZzb   # ElevenLabs voice ID
  # api_key: ${ELEVENLABS_API_KEY}    # 支持环境变量引用

# ASR 配置信息，可以改对应的模型，建议browser
asr:
  mode: server  # browser | server | auto (优先浏览器，不支持时用后端)
  type: sensevoice  # whisper | funasr | sensevoice (仅 mode=server 时使用)
  model_name: "iic/SenseVoiceSmall"  # sensevoice 模型名 (本地路径或 ModelScope ID)
  model_size: base  # tiny | base | small | medium | large
  language: auto  # zh | en | auto
  device: auto  # auto | cpu | cuda
  vad:
    enabled: true        # set false to disable VAD gating and always run Whisper
    threshold: 0.62      # SileroVAD speech probability threshold (0.0–1.0); higher = less sensitive to noise
    min_speech_ms: 350   # minimum speech segment duration in ms; shorter clips are treated as silence

# LLM 配置信息，可以改对应的模型
llm:
  api_key: ${DASHSCOPE_API_KEY}  # 支持环境变量引用
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen-plus

# Audio 配置信息，不要更改
audio:
  fps: 50
  sample_rate: 16000

# Video配置信息，运用于ERNeRF和TalkingGaussian
video:
  width: 450
  height: 450
  fps: 25

# CustomVideo配置信息
custom_video:
  config_path: ''
