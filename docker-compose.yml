# MinaTalker Docker Compose — GPU via docker-compose.gpu.yml + docker.env
#
# Host bind mounts (repo root = directory of this file):
#   ./models  → read-only at /models-host; entrypoint copies into minatalker_models volume
#   ./data    → avatar frames
#
# Usage (from repo root):
#   docker compose --env-file docker.env -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#   curl -k https://localhost:8010/health

services:
  minatalker:
    build:
      context: .
      dockerfile: Dockerfile
    image: minatalker:wav2lip
    container_name: minatalker
    restart: unless-stopped
    ports:
      - "8010:8010"
    env_file:
      - docker.env
    environment:
      SYNC_MODELS: "${SYNC_MODELS:-0}"
    volumes:
      - type: bind
        source: ${MINATALKER_PROJECT_DIR:-.}/models
        target: /models-host
        read_only: true
      - minatalker_models:/app/models
      - type: bind
        source: ${MINATALKER_PROJECT_DIR:-.}/data
        target: /app/data
      - type: bind
        source: ${MINATALKER_PROJECT_DIR:-.}/src
        target: /app/src
        read_only: true
      - type: bind
        source: ${MINATALKER_PROJECT_DIR:-.}/config/config_wav2lip_docker.yaml
        target: /app/config/config_wav2lip_docker.yaml
        read_only: true
      - type: bind
        source: ${MINATALKER_PROJECT_DIR:-.}/config/config_wav2lip.yaml
        target: /app/config/config_wav2lip.yaml
        read_only: true
      - type: bind
        source: ${MINATALKER_PROJECT_DIR:-.}/config/avatar_config.yaml
        target: /app/config/avatar_config.yaml
        read_only: true
      - type: bind
        source: ${MINATALKER_PROJECT_DIR:-.}/ssl_certs
        target: /app/ssl_certs
      - minatalker_model_cache:/root/.cache

volumes:
  minatalker_models:
  minatalker_model_cache:
