[project]
name = "linly-talker-stream"
version = "0.1.0"
description = "MinaTalker"
readme = "README.md"
requires-python = ">=3.10, <3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "", email = "lucas@minamina.ai" }
]

dependencies = [
    "aiohttp",
    "aiohttp-cors",
    "aiortc",
    "av",
    "edge-tts",
    "librosa",
    "omegaconf",
    "openai",
    "numpy<2",
    "opencv-python-headless<4.12",
    "pydantic",
    "PyYAML",
    "scipy",
    "soundfile==0.12.1",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "torchaudio==2.8.0",
    "tqdm",
    "typing-extensions",
    "websockets>=13.0",
    "resampy",
    "azure-cognitiveservices-speech",
    "logger",
    "transformers==4.46.0",
]

[project.optional-dependencies]
# Server-side Agora publisher: Linux/macOS only (no Windows wheels / native SDK).
agora = [
    "agora-python-server-sdk; sys_platform == 'linux' or sys_platform == 'darwin'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]
torchvision = [
    { index = "pytorch-cu128" },
]
torchaudio = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
